name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore eMarket.slnx

      - name: Vulnerability audit
        run: dotnet list eMarket.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build eMarket.slnx --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test eMarket.slnx --configuration Release --no-build --verbosity normal

      - name: Build production container
        run: docker build --pull -t emarket-api:ci .
